services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
    volumes: [redis-data:/data]
  api:
    build: ./api
    ports: ["8080:8080"]
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis: { condition: service_healthy }
  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
volumes:
  redis-data:
